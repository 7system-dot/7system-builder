<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Favicon 7S dourado em fundo azul escuro">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#0B2552"/>
      <stop offset="55%" stop-color="#071B3B"/>
      <stop offset="100%" stop-color="#031126"/>
    </radialGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A6"/>
      <stop offset="16%" stop-color="#F8D36A"/>
      <stop offset="42%" stop-color="#D8A62E"/>
      <stop offset="68%" stop-color="#FFD86C"/>
      <stop offset="100%" stop-color="#A86E10"/>
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFCF78"/>
      <stop offset="50%" stop-color="#B78127"/>
      <stop offset="100%" stop-color="#F6D989"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect x="6" y="6" width="500" height="500" rx="96" fill="url(#bg)"/>
  <rect x="9" y="9" width="494" height="494" rx="92"
        fill="none" stroke="url(#goldBorder)" stroke-width="6"/>

  <!-- Luz interna sutil -->
  <ellipse cx="256" cy="205" rx="170" ry="120" fill="#16386E" opacity="0.18"/>

